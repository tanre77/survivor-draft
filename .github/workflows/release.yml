name: release
# Manual store upload only. Pushing this file does not upload anything.
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Which store to upload to
        required: true
        type: choice
        options:
          - ios
          - android
          - both
      upload_metadata:
        description: Also push store listing text (privacy and support URLs)
        required: false
        type: boolean
        default: false
jobs:
  testflight:
    if: inputs.platform == 'ios' || inputs.platform == 'both'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: false
      - run: bundle install
      - name: Require App Store secrets
        env:
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          PUBLIC_WEB_ORIGIN: ${{ secrets.PUBLIC_WEB_ORIGIN }}
        run: |
          set -euo pipefail
          missing=0
          for key in APP_STORE_CONNECT_API_KEY APP_STORE_CONNECT_KEY_ID APP_STORE_CONNECT_ISSUER_ID APPLE_TEAM_ID MATCH_GIT_URL MATCH_PASSWORD PUBLIC_WEB_ORIGIN; do
            if [ -z "${!key}" ]; then
              echo "Missing secret: ${key}"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Refusing to upload. Add the secrets above. Nothing was sent to App Store Connect."
            exit 1
          fi
      - run: npm ci
      - run: npm run board
      - run: brew install xcodegen
      - run: xcodegen generate
        working-directory: ios
      - name: Upload to TestFlight
        env:
          RELEASE_UPLOAD: "1"
          UPLOAD_STORE_METADATA: ${{ inputs.upload_metadata }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          PUBLIC_WEB_ORIGIN: ${{ secrets.PUBLIC_WEB_ORIGIN }}
        run: bundle exec fastlane ios beta
  play:
    if: inputs.platform == 'android' || inputs.platform == 'both'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: false
      - run: bundle install
      - name: Install Android SDK 36
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          test -d "$SDK"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          TOOLS="$(dirname "$(find "$SDK/cmdline-tools" -type f -name sdkmanager -print -quit)")"
          echo "$TOOLS" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          yes | "$TOOLS/sdkmanager" --licenses >/dev/null || true
          "$TOOLS/sdkmanager" --install "platforms;android-36" "build-tools;36.0.0"
      - name: Require Play secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          PUBLIC_WEB_ORIGIN: ${{ secrets.PUBLIC_WEB_ORIGIN }}
        run: |
          set -euo pipefail
          missing=0
          for key in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD PLAY_SERVICE_ACCOUNT_JSON PUBLIC_WEB_ORIGIN; do
            if [ -z "${!key}" ]; then
              echo "Missing secret: ${key}"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Refusing to upload. Add the secrets above. Nothing was sent to Play."
            exit 1
          fi
      - name: Upload to the Play internal track
        env:
          RELEASE_UPLOAD: "1"
          UPLOAD_STORE_METADATA: ${{ inputs.upload_metadata }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          PUBLIC_WEB_ORIGIN: ${{ secrets.PUBLIC_WEB_ORIGIN }}
        run: bundle exec fastlane android internal
