name: ios
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "ios/**"
      - "native/**"
      - "shared/**"
      - "src/data/league.ts"
      - "src/data/airtime.ts"
      - "src/data/airtime.test.ts"
      - "src/lib/wiki-board.ts"
      - "src/lib/wiki-board.test.ts"
      - "src/styles.css"
      - ".github/workflows/ios.yml"
      - "package.json"
      - "package-lock.json"
jobs:
  xcode:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm install --prefix android --ignore-scripts
      - run: npm run check:native
      - name: Generated board and palette are committed
        run: |
          paths="ios/SurvivorDraft/Generated android/src/data/board.ts shared/board.json"
          if [ -n "$(git status --porcelain -- $paths)" ]; then
            git status --porcelain -- $paths
            git diff -- $paths
            exit 1
          fi
      - run: brew install xcodegen
      - run: xcodegen generate
        working-directory: ios
      - name: Build and test on a simulator without signing
        working-directory: ios
        run: |
          set -euo pipefail
          xcrun simctl list devices available
          NAME=$(xcrun simctl list devices available | grep -E "iPhone" | head -1 | sed -E 's/^[[:space:]]*//; s/ \([0-9A-Fa-f-]+\).*//')
          if [ -z "${NAME}" ]; then
            echo "No iPhone simulator is available"
            exit 1
          fi
          echo "Using simulator: ${NAME}"
          xcodebuild \
            -project SurvivorDraft.xcodeproj \
            -scheme SurvivorDraft \
            -destination "platform=iOS Simulator,name=${NAME}" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="-" \
            build test
