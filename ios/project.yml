name: SurvivorDraft
options:
  bundleIdPrefix: com.tanre77
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    GENERATE_INFOPLIST_FILE: NO
    INFOPLIST_FILE: SurvivorDraft/Info.plist
    PRODUCT_BUNDLE_IDENTIFIER: com.tanre77.survivordraft
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    # Signing stays off until an Apple team is chosen. Do not invent a team id.
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
targets:
  SurvivorDraft:
    type: application
    platform: iOS
    sources:
      - SurvivorDraft
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_FILE: SurvivorDraft/Info.plist
        CODE_SIGN_STYLE: Automatic
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
  SurvivorDraftTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - SurvivorDraftTests
    dependencies:
      - target: SurvivorDraft
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
