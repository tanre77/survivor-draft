plugins {
    id "com.android.application"
}

// Crashlytics and the Google services plugin stay commented out until
// android/android/app/google-services.json from the real Firebase project is present.
// id "com.google.gms.google-services"
// id "com.google.firebase.crashlytics"

def releaseProp = { String name ->
    def fromEnv = System.getenv(name)
    if (fromEnv != null && !fromEnv.trim().isEmpty()) return fromEnv.trim()
    def fromGradle = project.findProperty(name)
    if (fromGradle == null) return null
    def text = fromGradle.toString().trim()
    return text.isEmpty() ? null : text
}

def keystorePath = releaseProp("ANDROID_KEYSTORE_PATH")
def keystorePassword = releaseProp("ANDROID_KEYSTORE_PASSWORD")
def keyAlias = releaseProp("ANDROID_KEY_ALIAS")
def keyPassword = releaseProp("ANDROID_KEY_PASSWORD")
def versionCodeValue = (releaseProp("VERSION_CODE") ?: "1").toInteger()
def versionNameValue = releaseProp("VERSION_NAME") ?: "1.0"

android {
    namespace "com.tanre77.survivordraft"
    compileSdk 36
    buildToolsVersion "36.0.0"
    defaultConfig {
        applicationId "com.tanre77.survivordraft"
        minSdk 26
        targetSdk 36
        versionCode versionCodeValue
        versionName versionNameValue
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    signingConfigs {
        release {
            if (keystorePath != null) {
                storeFile file(keystorePath)
                storePassword keystorePassword
                keyAlias keyAlias
                keyPassword keyPassword
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            if (keystorePath != null) {
                signingConfig signingConfigs.release
            }
        }
    }
}
